<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0d0d12" />
<title>TINDER</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ================= CONNECTION BANNER ================= -->
<div id="connBanner" class="conn-banner hidden">Reconnecting…</div>

<!-- ================= LOGIN SCREEN ================= -->
<section id="loginScreen" class="screen login-screen">
  <div class="login-card">
    <h1 class="brand">TINDER</h1>
    <p class="founder-text">
    Founder of TINDER ~ <span>AYUSH KUMAR</span>
    </p>
    <p class="brand-sub">Private group chat</p>

    <label class="field">
      <span>Username</span>
      <input id="loginUsername" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
    </label>

    <label class="field">
      <span>Secret Code</span>
      <input id="loginCode" type="password" placeholder="Enter secret code" autocomplete="off" />
    </label>

    <button id="loginBtn" class="btn-primary">Login</button>
    <p id="loginError" class="error-text"></p>
  </div>
</section>

<!-- ================= CHAT SCREEN ================= -->
<section id="chatScreen" class="screen chat-screen hidden">

  <!-- Header -->
  <header class="top-bar">
    <div class="top-left">
      <h2 class="top-title">TINDER</h2>
      <button id="onlineBtn" class="online-pill" title="Show members">
        <span class="dot"></span><span id="onlineCount">0</span> online
      </button>
    </div>
    <div class="top-actions">
      <button id="searchToggle" class="icon-btn" title="Search messages">🔍</button>
      <button id="themeToggle" class="icon-btn" title="Switch theme">🌙</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
      <button id="logoutBtn" class="icon-btn danger" title="Logout">⏻</button>
    </div>
  </header>

  <!-- Search bar -->
  <div id="searchBar" class="search-bar hidden">
    <input id="searchInput" type="text" placeholder="Search messages…" />
    <button id="searchClear" class="icon-btn">✕</button>
  </div>

  <!-- Messages -->
  <main id="messages" class="messages"></main>

  <!-- Typing -->
  <div id="typingIndicator" class="typing-indicator hidden"></div>

  <!-- Reply preview -->
  <div id="replyBar" class="reply-bar hidden">
    <div class="reply-bar-body">
      <strong id="replyBarName"></strong>
      <span id="replyBarText"></span>
    </div>
    <button id="replyCancel" class="icon-btn">✕</button>
  </div>

  <!-- Edit preview -->
  <div id="editBar" class="reply-bar edit hidden">
    <div class="reply-bar-body"><strong>Editing message</strong></div>
    <button id="editCancel" class="icon-btn">✕</button>
  </div>

  <!-- Composer -->
  <footer class="composer">
    <button id="imageBtn" class="icon-btn" title="Send image">🖼️</button>
    <input id="imageInput" type="file" accept="image/*" hidden />
    <div class="input-wrap">
      <textarea id="messageInput" rows="1" maxlength="1000"
                placeholder="Write a message…"></textarea>
      <span id="charCount" class="char-count">0/1000</span>
    </div>
    <button id="sendBtn" class="send-btn" title="Send">➤</button>
  </footer>
</section>

<!-- ================= SETTINGS MODAL ================= -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h3>Settings</h3>

    <label class="field">
      <span>Username</span>
      <input id="setUsername" type="text" maxlength="20" />
    </label>

    <label class="field">
      <span>Age</span>
      <input id="setAge" type="number" min="1" max="120" placeholder="Your age" />
    </label>

    <label class="field">
      <span>Phone number <em>(optional)</em></span>
      <input id="setPhone" type="tel" maxlength="20" placeholder="Optional" />
    </label>

    <p class="hint">Only your username is visible in the chat.</p>

    <div class="modal-actions">
      <button id="settingsClose" class="btn-ghost">Cancel</button>
      <button id="settingsSave" class="btn-primary">Save changes</button>
    </div>
  </div>
</div>

<!-- ================= MEMBERS MODAL ================= -->
<div id="membersModal" class="modal hidden">
  <div class="modal-card">
    <h3>Members</h3>
    <div id="membersList" class="members-list"></div>
    <div class="modal-actions">
      <button id="membersClose" class="btn-ghost">Close</button>
    </div>
  </div>
</div>

<!-- ================= MESSAGE ACTION SHEET ================= -->
<div id="actionSheet" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="reaction-row">
      <button class="react" data-emoji="😀">😀</button>
      <button class="react" data-emoji="❤️">❤️</button>
      <button class="react" data-emoji="👍">👍</button>
      <button class="react" data-emoji="😂">😂</button>
      <button class="react" data-emoji="😢">😢</button>
      <button class="react" data-emoji="😮">😮</button>
    </div>
    <button class="sheet-item" data-act="reply">↩️ Reply</button>
    <button class="sheet-item" data-act="copy">📋 Copy</button>
    <button class="sheet-item own-only" data-act="edit">✏️ Edit</button>
    <button class="sheet-item own-only danger" data-act="delete">🗑️ Delete</button>
    <button class="sheet-item cancel" data-act="cancel">Cancel</button>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div id="toast" class="toast hidden"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>
</body>
  </html>
